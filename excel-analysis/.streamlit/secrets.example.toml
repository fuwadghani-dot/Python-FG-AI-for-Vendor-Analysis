# Example secrets file - DO NOT COMMIT real secrets
# Copy this to a local .streamlit/secrets.toml (not checked in) or set secrets in Streamlit Cloud UI

SERVICE_TOKEN = "your_service_token_here"

# SMTP settings (optional - only if you want email alerts)
SMTP_HOST = "smtp.example.com"
SMTP_PORT = 587
SMTP_USER = "user@example.com"
SMTP_PASS = "supersecret"
ALERT_FROM = "alerts@example.com"
ALERT_TO = "you@example.com"

# Optional public base URL for hosted reports (used in alert links)
REPORT_BASE_URL = "https://myhost.example.com/reports/"